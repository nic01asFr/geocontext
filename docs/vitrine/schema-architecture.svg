<svg class="diag" viewBox="0 0 900 450" role="img" aria-labelledby="d1t d1d">
  <title id="d1t">Deux modes d'usage, un contexte commun</title>
  <desc id="d1d">Dans le mode client MCP, un client piloté par un modèle (acteur) et une MCP App (surface) agissent sur le serveur. Dans le mode site web, l'agent intégré (acteur) et l'interface web (surface) font de même. Le serveur geocontext porte un contexte commun, le registre de sources et le territoire exact, avec d'un côté les outils MCP standard et de l'autre les ajouts pour le site web.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>

  <text x="230" y="22" text-anchor="middle" style="font-weight:600">Mode client MCP</text>
  <text class="t2" x="230" y="40" text-anchor="middle">l'utilisateur apporte son client et son modèle</text>
  <text x="670" y="22" text-anchor="middle" style="font-weight:600">Mode site web</text>
  <text class="t2" x="670" y="40" text-anchor="middle">l'exploitant fournit l'interface et le modèle</text>

  <rect class="col" x="20" y="52" width="420" height="124" rx="10"/>
  <rect class="col" x="460" y="52" width="420" height="124" rx="10"/>

  <rect class="box" x="36" y="68" width="190" height="92" rx="8"/>
  <text class="t2" x="131" y="87" text-anchor="middle">ACTEUR · le modèle appelle les outils</text>
  <text x="131" y="113" text-anchor="middle" style="font-weight:600">Client MCP</text>
  <text class="t2" x="131" y="132" text-anchor="middle">Claude Desktop, Cursor…</text>

  <rect class="box" x="234" y="68" width="190" height="92" rx="8"/>
  <text class="t2" x="329" y="87" text-anchor="middle">SURFACE · affiche</text>
  <text x="329" y="113" text-anchor="middle" style="font-weight:600">MCP App</text>
  <text class="t2" x="329" y="132" text-anchor="middle">carte dans le client</text>
  <text class="t2" x="329" y="148" text-anchor="middle">sans accusé d'affichage</text>

  <rect class="box" x="476" y="68" width="190" height="92" rx="8"/>
  <text class="t2" x="571" y="87" text-anchor="middle">ACTEUR · le modèle appelle les outils</text>
  <text x="571" y="113" text-anchor="middle" style="font-weight:600">Agent intégré</text>
  <text class="t2" x="571" y="132" text-anchor="middle">boucle côté serveur</text>

  <rect class="box" x="674" y="68" width="190" height="92" rx="8"/>
  <text class="t2" x="769" y="87" text-anchor="middle">SURFACE · affiche, relit, accuse</text>
  <text x="769" y="113" text-anchor="middle" style="font-weight:600">Interface web</text>
  <text class="t2" x="769" y="132" text-anchor="middle">carte, tableaux, filtres</text>
  <text class="t2" x="769" y="148" text-anchor="middle">saisie directe sans modèle</text>

  <path class="arrow" d="M230 176 L230 212" marker-end="url(#ar)"/>
  <path class="arrow" d="M670 176 L670 212" marker-end="url(#ar)"/>

  <rect class="core" x="20" y="214" width="860" height="170" rx="10"/>
  <text x="450" y="240" text-anchor="middle" style="font-weight:600">Serveur geocontext · une session par connexion</text>
  <text class="t2" x="450" y="260" text-anchor="middle">contexte commun : niveau, code, emprise, géométrie exacte, thème, données, couches, historique</text>
  <text class="t2" x="450" y="278" text-anchor="middle">registre de sources (49) · exécuteurs WFS / REST · mode « territoire exact »</text>

  <rect class="box" x="40" y="298" width="400" height="70" rx="8"/>
  <text x="240" y="322" text-anchor="middle" style="font-weight:600">Pour tout client MCP</text>
  <text class="t2" x="240" y="344" text-anchor="middle">sept outils · ressources · prompt de guidage</text>

  <rect class="box" x="460" y="298" width="400" height="70" rx="8"/>
  <text x="660" y="322" text-anchor="middle" style="font-weight:600">Ajouts pour le site web</text>
  <text class="t2" x="660" y="344" text-anchor="middle">interface · /agent · /tiles · /liens · accusé d'affichage (ui_*)</text>

  <path class="arrow" d="M450 384 L450 408" marker-end="url(#ar)"/>
  <text x="450" y="432" text-anchor="middle">Géoplateforme (WFS, géocodage, altimétrie) · Géorisques · RNB · ADEME · autres</text>
</svg>
