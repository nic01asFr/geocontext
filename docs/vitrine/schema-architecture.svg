<svg class="diag" viewBox="0 0 900 400" role="img" aria-labelledby="d1t d1d">
      <title id="d1t">Une session, quatre accès</title>
      <desc id="d1d">Quatre accès (client MCP, interface web, MCP App, agent intégré) agissent sur une même session du serveur geocontext, qui s'appuie sur un registre de sources et les services de la Géoplateforme.</desc>
      <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
      <rect class="box" x="20" y="20" width="200" height="64" rx="8"/><text x="120" y="48" text-anchor="middle">Client MCP</text><text class="t2" x="120" y="66" text-anchor="middle">Claude Desktop, Cursor…</text>
      <rect class="box" x="245" y="20" width="200" height="64" rx="8"/><text x="345" y="48" text-anchor="middle">Interface web</text><text class="t2" x="345" y="66" text-anchor="middle">carte, tableaux, filtres</text>
      <rect class="box" x="470" y="20" width="200" height="64" rx="8"/><text x="570" y="48" text-anchor="middle">MCP App</text><text class="t2" x="570" y="66" text-anchor="middle">carte dans le client MCP</text>
      <rect class="box" x="695" y="20" width="185" height="64" rx="8"/><text x="787" y="48" text-anchor="middle">Agent intégré</text><text class="t2" x="787" y="66" text-anchor="middle">boucle côté serveur</text>
      <path class="arrow" d="M120 84 L120 128 L400 128 L400 150" marker-end="url(#ar)"/>
      <path class="arrow" d="M345 84 L345 150" marker-end="url(#ar)"/>
      <path class="arrow" d="M570 84 L570 128 L470 128 L470 150" marker-end="url(#ar)"/>
      <path class="arrow" d="M787 84 L787 128 L520 128 L520 150" marker-end="url(#ar)"/>
      <rect class="core" x="150" y="150" width="600" height="96" rx="10"/>
      <text x="450" y="178" text-anchor="middle" style="font-weight:600">Serveur MCP · une session par connexion</text>
      <text class="t2" x="450" y="200" text-anchor="middle">contexte de navigation : niveau, code, emprise, thème, données, couches, historique</text>
      <text class="t2" x="450" y="220" text-anchor="middle">sept outils · ressources · prompt de guidage · protocole d'accusé de l'affichage</text>
      <path class="arrow" d="M450 246 L450 280" marker-end="url(#ar)"/>
      <rect class="box" x="150" y="280" width="600" height="56" rx="8"/>
      <text x="450" y="303" text-anchor="middle">Registre déclaratif de sources (49) et exécuteurs WFS / REST</text>
      <text class="t2" x="450" y="322" text-anchor="middle">mode « territoire exact » · nouvelles tentatives · transformations de champs</text>
      <path class="arrow" d="M450 336 L450 366" marker-end="url(#ar)"/>
      <text x="450" y="388" text-anchor="middle">Géoplateforme (WFS, géocodage, altimétrie) · Géorisques · RNB · ADEME · autres</text>
    </svg>
