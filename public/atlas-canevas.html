<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suite de test atlas-bi — profil complet (canevas)</title>
<style>body{margin:0;font:13px system-ui,sans-serif;display:grid;grid-template-columns:1fr 400px;height:100vh}atlas-bi{display:block;height:100vh;min-width:0}aside{overflow:auto;border-left:1px solid #ccc;padding:8px;background:#f6f7f9}
td{border-bottom:1px solid #ddd;padding:2px 4px;vertical-align:top;font-size:12px}.ok{color:#0a7a3b}.ko{color:#b3261e}button{padding:4px 10px;margin:2px}#ev{font:11px monospace;white-space:pre-wrap;max-height:90px;overflow:auto;background:#fff;border:1px solid #ddd;padding:3px}</style></head><body>
<atlas-bi id="carte" profil="complet" src="https://nic01asfr.github.io/Widgets-Grist/atlas/index.html" delai="60000" delai-connexion="60000"></atlas-bi>
<aside><b>Profil complet (canevas)</b> <button id="next" disabled>Continuer ▶</button> <span id="etat">init</span><table id="t"></table><div id="ev"></div></aside>
<script type="module">
await import('https://nic01asfr.github.io/Widgets-Grist/atlas/lib/bi/atlas-bi-element.js');
const $=id=>document.getElementById(id),carte=$('carte'),wait=ms=>new Promise(r=>setTimeout(r,ms));
const ev={};window.__ev={};for(const t of['pret','select','hover','camera','layer','error','ready','legend','progress'])carte.addEventListener('atlas-bi-'+t,e=>{ev[t]=(ev[t]||0)+1;window.__ev[t]=e.detail;$('ev').textContent=Object.entries(ev).map(([k,v])=>k+':'+v).join('  ')});
const PAUSES=new Set((new URLSearchParams(location.search).get('pause')||'').split(',').filter(Boolean).map(Number));let cnt=0;
async function step(nom,fn,{pause=false}={}){$('etat').textContent='… '+nom;let st='ok',d='';try{const r=await fn();d=typeof r==='string'?r:JSON.stringify(r)}catch(e){st='ko';d=(e.code?e.code+' : ':'')+e.message}
 d=(d||'').slice(0,240);cnt++;$('t').insertAdjacentHTML('beforeend',`<tr><td>${cnt}</td><td class="${st}">${st==='ok'?'✔':'✘'}</td><td><b>${nom}</b><br>${d.replace(/</g,'&lt;')}</td></tr>`);
 if(PAUSES.has(cnt)){$('etat').textContent='⏸ '+nom;$('next').disabled=false;await new Promise(r=>$('next').onclick=()=>{$('next').disabled=true;r()})}else if(pause)await wait(2500)}
const wfs=async(type,bbox,count)=>{const u=new URL('https://data.geopf.fr/wfs/ows');u.search=new URLSearchParams({SERVICE:'WFS',VERSION:'2.0.0',REQUEST:'GetFeature',TYPENAMES:type,OUTPUTFORMAT:'application/json',SRSNAME:'EPSG:4326',COUNT:count,CQL_FILTER:`BBOX(geometrie,${bbox.join(',')},'EPSG:4326')`});return(await(await fetch(u)).json()).features};
const BB=[5.370,43.2945,5.378,43.2995];const bat=await wfs('BDTOPO_V3:batiment',BB,800),rou=await wfs('BDTOPO_V3:troncon_de_route',BB,200);
const U=[...new Set(bat.map(f=>f.properties.usage_1||'inconnu'))],pal=['#0072b2','#e69f00','#009e73','#cc79a7','#d55e00','#56b4e9','#f0e442','#888'];
const FB=bat.map((f,i)=>({type:'Feature',id:i+1,geometry:f.geometry,properties:{nom:(f.properties.cleabs||'').slice(-6),usage:f.properties.usage_1||'inconnu',hauteur:f.properties.hauteur??10}}));
const FR=rou.map((f,i)=>({type:'Feature',id:5000+i,geometry:f.geometry,properties:{nom:(f.properties.cleabs||'').slice(-6),nature:f.properties.nature||''}}));
const SCENE={version:'0.2.2',project_name:'geocontext × Atlas — Vieux-Port',title:'Vieux-Port (BDTOPO)',layers:[
 {id:'bati',name:'Bâtiments BDTOPO',order:1,geometry_type:'polygon',visible:true,source:{type:'geojson',classe:'externe'},crs:'EPSG:4326',geojson:{type:'FeatureCollection',features:FB},style:{declarative:{kind:'categorized',field:'usage',stops:U.map((v,i)=>({value:v,color:pal[i%8]})),fallback:'#888'}},popup_template:'<b>{nom}</b><br>{usage} · {hauteur} m'},
 {id:'routes',name:'Routes',order:0,geometry_type:'line',visible:true,source:{type:'geojson',classe:'externe'},crs:'EPSG:4326',geojson:{type:'FeatureCollection',features:FR},style:{declarative:{kind:'single',color:'#333'}},popup_template:'{nom} ({nature})'}],
 story:{version:'0.2.2',steps:[
  {title:'Le Vieux-Port',text:'Vue d\'ensemble des bâtiments BDTOPO, colorés par usage.',panels:[{type:'title',content:'Vieux-Port'},{type:'legend',layerId:'bati'}],state:{camera:{center:[5.374,43.297],zoom:16.5,pitch:0,bearing:0},layers:[{name:'Bâtiments BDTOPO',visible:true},{name:'Routes',visible:true}]}},
  {title:'En relief, au coucher du soleil',text:'Même scène, inclinée, avec l\'ombre portée de 18 h.',panels:[{type:'body',content:'Inclinaison 60°, cap 40°.',layout:'side-left'}],state:{camera:{center:[5.374,43.297],zoom:17.2,pitch:60,bearing:40},settings:{timeOfDay:18},layers:[{name:'Bâtiments BDTOPO',visible:true},{name:'Routes',visible:false}]}},
  {title:'Seulement les routes',text:'Les bâtiments disparaissent.',state:{camera:{center:[5.374,43.297],zoom:16.8,pitch:30,bearing:0},layers:[{name:'Bâtiments BDTOPO',visible:false},{name:'Routes',visible:true}]}}]}};
await step('Données réelles',()=>`${FB.length} bâtiments, ${FR.length} routes · scène ≈ ${(JSON.stringify(SCENE).length/1e6).toFixed(2)} Mo`);
await step('Connexion (atlas-bi-pret : canevas ?)',async()=>{const v=await carte.pret;await wait(2000);return JSON.stringify(v)+' | pret: '+JSON.stringify(window.__ev.pret)});
await step('ping',async()=>JSON.stringify(await carte.ping()));
await step('setScene : scène Atlas 0.2.2 (2 couches + récit 3 étapes)',async()=>JSON.stringify(await carte.setScene(SCENE)),{pause:true});
await step('ping : couches_scene',async()=>JSON.stringify((await carte.ping())));
await step('fitTo()',()=>carte.fitTo(),{pause:true});
await step('flyTo pitch 60 bearing 40 (3D + éclairage)',()=>carte.flyTo({center:[5.374,43.297],zoom:17.3,pitch:60,bearing:40,duration:1500}),{pause:true});
await step('setLayerVisibility(routes,false)',()=>carte.setLayerVisibility('routes',false));
await step('setLayerVisibility(routes,true)',()=>carte.setLayerVisibility('routes',true));
for(const f of['plan-ign','photo','uni'])await step('setFond '+f,async()=>JSON.stringify(await carte.setFond(f)),{pause:true});
await step('setFond atlas',async()=>JSON.stringify(await carte.setFond('atlas')));
await step('setTheme',async()=>JSON.stringify(await carte.setTheme({tokens:{'--atlas-principal':'#000091'}})).slice(0,160));
await step('marges (right:340)',async()=>{await carte.setMarges({right:340});await carte.fitTo();return 'ok'},{pause:true});
await step('marges retirées',()=>carte.flyTo({marges:null}));
await step('setFilter (scène Atlas, couche sans contrôle) -> refus attendu',async()=>{try{return 'accepté: '+JSON.stringify(await carte.setFilter('f-x',['a']))}catch(e){return 'refusé: '+(e.code||'')+' '+e.message}});
await step('select(id) sur une couche de scène Atlas (« pas encore piloté » dans la doc)',async()=>{try{return 'accepté: '+JSON.stringify(await carte.select(10))}catch(e){return 'refusé: '+(e.code||'')+' '+e.message}});
await step('dalles3d avec manifeste de grille inexistant -> erreur attendue',async()=>{const r=await carte.setScene({version:'0.2.2',project_name:'Maquette',layers:[{id:'maq',name:'Maquette 3D',type:'dalles3d',dalles3d:{grille:'https://example.invalid/grille3d.json'}}]});return JSON.stringify(r)});
await step('scène avec adresse relative -> refus attendu (règle de sécurité)',async()=>{try{const r=await carte.setScene({version:'0.2.2',project_name:'x',layers:[{id:'r',name:'R',geometry_type:'point',source:{type:'geojson',classe:'externe'},geojson:'données/x.geojson'}]});return 'accepté: '+JSON.stringify(r)}catch(e){return 'refusé: '+(e.code||'')+' '+e.message}});
await step('Rétablir la scène complète',async()=>JSON.stringify(await carte.setScene(SCENE)));
$('etat').textContent='terminé';window.__done=true;
</script></body></html>
