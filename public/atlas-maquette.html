<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas — maquette 3D en dalles</title>
<style>body{margin:0;font:13px system-ui,sans-serif;display:grid;grid-template-columns:1fr 380px;height:100vh}atlas-bi{display:block;height:100vh;min-width:0}aside{overflow:auto;border-left:1px solid #ccc;padding:8px;background:#f6f7f9}td{border-bottom:1px solid #ddd;padding:2px 4px;font-size:12px;vertical-align:top}.ok{color:#0a7a3b}.ko{color:#b3261e}button{padding:4px 10px}</style></head><body>
<atlas-bi id="carte" profil="complet" src="https://nic01asfr.github.io/Widgets-Grist/atlas/index.html" delai="60000" delai-connexion="60000"></atlas-bi>
<aside><b>Maquette 3D (dalles L93, format Fabrique)</b> <button id="next" disabled>Continuer ▶</button> <span id="etat"></span><table id="t"></table></aside>
<script type="module">
await import('https://nic01asfr.github.io/Widgets-Grist/atlas/lib/bi/atlas-bi-element.js');
const $=id=>document.getElementById(id),carte=$('carte'),wait=ms=>new Promise(r=>setTimeout(r,ms));
const PAUSES=new Set((new URLSearchParams(location.search).get('pause')||'').split(',').filter(Boolean).map(Number));let cnt=0;
async function step(nom,fn){$('etat').textContent='… '+nom;let st='ok',d='';try{const r=await fn();d=typeof r==='string'?r:JSON.stringify(r)}catch(e){st='ko';d=(e.code?e.code+' : ':'')+e.message}
 cnt++;$('t').insertAdjacentHTML('beforeend',`<tr><td>${cnt}</td><td class="${st}">${st==='ok'?'✔':'✘'}</td><td><b>${nom}</b><br>${(d||'').slice(0,260).replace(/</g,'&lt;')}</td></tr>`);
 if(PAUSES.has(cnt)){$('etat').textContent='⏸ '+nom;$('next').disabled=false;await new Promise(r=>$('next').onclick=()=>{$('next').disabled=true;r()})}}
const GR=location.origin+'/maquette/grille3d.json';
const MAQ={version:'0.2.2',project_name:'Maquette synthétique',layers:[{id:'maquette',name:'Maquette 3D',type:'dalles3d',dalles3d:{grille:GR}}]};
await step('Connexion',async()=>JSON.stringify(await carte.pret).slice(0,120));
await step('setScene : couche dalles3d (manifeste '+GR.replace(location.origin,'')+')',async()=>JSON.stringify(await carte.setScene(MAQ)));
await step('flyTo sur la maquette (zoom 17, pitch 60)',async()=>{await wait(1500);await carte.flyTo({center:[5.3735,43.2955],zoom:17,pitch:60,bearing:20,duration:1500});await wait(4000);return 'ok'});
await step('ping : couches_scene',async()=>JSON.stringify(await carte.ping()));
await step('flyTo plus loin (zoom 15 : niveau D3 attendu au-delà de 700 m)',async()=>{await carte.flyTo({center:[5.3735,43.2955],zoom:15,pitch:50,bearing:20,duration:1500});await wait(4000);return 'ok'});
await step('fond photo',async()=>JSON.stringify(await carte.setFond('photo')));
await step('flyTo rapproché zoom 18.5 (niveau D2)',async()=>{await carte.flyTo({center:[5.3735,43.2955],zoom:18.3,pitch:65,bearing:60,duration:1500});await wait(4000);return 'ok'});
await step('masquer la maquette puis la remontrer',async()=>{const a=await carte.setLayerVisibility('maquette',false);await wait(1200);const b=await carte.setLayerVisibility('maquette',true);await wait(1200);return JSON.stringify([a,b])});
await step('manifeste de grille absent -> erreur attendue',async()=>JSON.stringify(await carte.setScene({version:'0.2.2',project_name:'x',layers:[{id:'m2',name:'M',type:'dalles3d',dalles3d:{grille:location.origin+'/maquette/inexistant.json'}}]})));
await step('manifeste d\'une autre origine pour les dalles (gabarit hostile) : refus attendu côté composant',async()=>'non testable sans serveur tiers : le test unitaire du composant couvre urlGabarit (origine) — voir lib/dalles3d-geo.js');
await step('Rétablir la maquette',async()=>JSON.stringify(await carte.setScene(MAQ)));
$('etat').textContent='terminé';
</script></body></html>
