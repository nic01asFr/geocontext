<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>geocontext × atlas-bi (essai)</title>
<style>body{margin:0;font:14px system-ui,sans-serif}header{padding:8px 12px;background:#000091;color:#fff}atlas-bi{display:block;height:70vh}pre{margin:8px 12px;white-space:pre-wrap}#leg span{display:inline-block;margin:2px 10px 2px 12px}#leg i{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-2px}</style></head><body>
<header>geocontext → <code>&lt;atlas-bi&gt;</code> chargé depuis GitHub Pages — essai</header>
<atlas-bi id="carte" src="https://nic01asfr.github.io/Widgets-Grist/atlas/index.html"></atlas-bi>
<div id="leg"></div><pre id="log">…</pre>
<script type="module">
const log=m=>{document.getElementById('log').textContent+='\n'+m};
await import('https://nic01asfr.github.io/Widgets-Grist/atlas/lib/bi/atlas-bi-element.js');
let sid,n=0;
async function rpc(method,params,notif){const b={jsonrpc:'2.0',method,...(params?{params}:{})};if(!notif)b.id=++n;
 const r=await fetch('/mcp',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json, text/event-stream',...(sid?{'Mcp-Session-Id':sid}:{})},body:JSON.stringify(b)});
 sid=r.headers.get('Mcp-Session-Id')||sid;let t=await r.text();if(!t.trim())return null;if(t.includes('data:'))t=t.split('\n').filter(l=>l.startsWith('data:')).pop().slice(5);return JSON.parse(t)}
const call=async(name,args)=>(await rpc('tools/call',{name,arguments:args})).result;
await rpc('initialize',{protocolVersion:'2025-03-26',capabilities:{},clientInfo:{name:'atlas-test',version:'1'}});await rpc('notifications/initialized',null,true);
const nav=await call('navigate',{target:'Marseille'});log('navigate: '+nav.content[0].text.split('\n')[0]);
const act=await call('action',{action:'batiments'});const txt=act.content.map(x=>x.text).join('\n');log('action: '+txt.split('\n')[1].slice(0,80));
const i0=txt.indexOf('{"_type"');let d=0,i1=i0;for(;i1<txt.length;i1++){const ch=txt[i1];if(ch==='{')d++;else if(ch==='}'){d--;if(!d){i1++;break}}}
const spec=JSON.parse(txt.slice(i0,i1)).layers.bati_bdtopo_commune;log('texte après le JSON : '+JSON.stringify(txt.slice(i1,i1+120)));
log('layerSpec: '+spec.typename+' · champs '+spec.fields.length);
const [x0,y0,x1,y1]=[5.37,43.285,5.40,43.305]; // zone de test réduite autour du centre
const u=new URL(spec.wfsUrl);u.search=new URLSearchParams({SERVICE:'WFS',VERSION:'2.0.0',REQUEST:'GetFeature',TYPENAMES:spec.typename,OUTPUTFORMAT:'application/json',SRSNAME:'EPSG:4326',COUNT:'1500',CQL_FILTER:`BBOX(geometrie,${x0},${y0},${x1},${y1},'EPSG:4326')`});
const gj=await (await fetch(u)).json();const feats=gj.features.map((f,i)=>({type:'Feature',id:i+1,geometry:f.geometry,properties:{cleabs:f.properties.cleabs,nature:f.properties.nature||'inconnu',usage:f.properties.usage_1||'inconnu',hauteur:f.properties.hauteur}}));
log('WFS: '+feats.length+' bâtiments (zone test)');
const vals=[...new Set(feats.map(f=>f.properties.usage))];const pal=['#0072b2','#e69f00','#009e73','#cc79a7','#d55e00','#56b4e9','#f0e442','#999999'];
const stops=vals.map((v,i)=>({value:v,color:pal[i%pal.length]}));
const carte=document.getElementById('carte');
carte.addEventListener('atlas-bi-select',e=>log('select '+JSON.stringify(e.detail.charge)));
carte.addEventListener('atlas-bi-erreur',e=>log('ERREUR '+JSON.stringify(e.detail.erreur)));
const c=await carte.setScene({layers:[{id:'bati',name:'Bâtiments BDTOPO',geometry_type:'polygon',cle:'cleabs',style:{declarative:{kind:'categorized',field:'usage',stops}}}]},{bati:feats});
log('setScene -> '+JSON.stringify(c));await carte.fitTo('bati');
try{const l=await carte.getLegend('bati');log('getLegend -> '+JSON.stringify(l).slice(0,300))}catch(e){log('getLegend: '+e.message)}
document.getElementById('leg').innerHTML=stops.map(s=>`<span><i style="background:${s.color}"></i>${s.value}</span>`).join('');
</script></body></html>
