<!doctype html><html><head><meta charset="utf-8"><title>Atlas gros volume</title><style>body{margin:0;display:grid;grid-template-columns:1fr 360px;height:100vh;font:12px monospace}atlas-bi{display:block;height:100vh}pre{margin:0;padding:6px;overflow:auto;background:#f4f4f4}</style></head><body>
<atlas-bi id="c" src="https://nic01asfr.github.io/Widgets-Grist/atlas/index.html" delai="60000" evenements-api></atlas-bi><pre id="o"></pre>
<script type="module">
await import('https://nic01asfr.github.io/Widgets-Grist/atlas/lib/bi/atlas-bi-element.js');
const c=document.getElementById('c'),o=document.getElementById('o'),Q=new URLSearchParams(location.search);
const log=(k,v)=>{(window.__big??={})[k]=v;o.textContent=Object.entries(window.__big).map(([a,b])=>a+': '+b).join('\n')};
const mem=()=>performance.memory?Math.round(performance.memory.usedJSHeapSize/1e6)+' Mo':'?';
const lim=+(Q.get('lim')||40);
const n=2**14,xs=[],tiles=[];for(let x=8428;x<=8442;x++)for(let y=5994;y<=6008;y++)tiles.push([x,y]);
const cx=8436,cy=6001;tiles.sort((a,b)=>((a[0]-cx)**2+(a[1]-cy)**2)-((b[0]-cx)**2+(b[1]-cy)**2));
const sel=tiles.slice(0,lim);log('tuiles',sel.length);
let t=performance.now(),bytes=0;const feats=new Map();
async function one([x,y]){const r=await fetch(`/tiles/batiment/14/${x}/${y}.json?props=nature,usage_1,hauteur`);const b=await r.arrayBuffer();bytes+=+r.headers.get('content-length')||0;const d=JSON.parse(new TextDecoder().decode(b));for(const f of d.features)if(!feats.has(f.id))feats.set(f.id,f)}
for(let i=0;i<sel.length;i+=8)await Promise.all(sel.slice(i,i+8).map(one));
log('1 fetch tuiles (chaud) ms',Math.round(performance.now()-t));log('  entités',feats.size);log('  mémoire après fetch',mem());
const F=[...feats.values()];window.__F=F;
const man={layers:[{id:'b',name:'Bâtiments',geometry_type:'polygon',style:{declarative:{kind:'categorized',field:'nature',opacity:.6,stops:[{value:'Indifférenciée',color:'#2a9d8f'},{value:'Industriel, agricole ou commercial',color:'#e9c46a'},{value:'Religieux',color:'#e76f51'},{value:'Remarquable',color:'#8338ec'}]}},visuel:{contour:{couleur:'#3d5560',largeur:.4}}}],interface:{legende:false}};
t=performance.now();
try{const r=await c.setScene(man,{b:F});log('2 setScene ms',Math.round(performance.now()-t));log('  retour',JSON.stringify(r).slice(0,120))}catch(e){log('2 setScene ✘',e.message)}
log('  mémoire après setScene',mem());
await c.setFond('plan-ign').catch(()=>{});
t=performance.now();await c.flyTo({center:[5.3735,43.2955],zoom:Number(Q.get('z')||11.5),bearing:0,pitch:0,duration:0});log('3 flyTo ms',Math.round(performance.now()-t));
t=performance.now();try{const g=await c.getLegend('b');log('4 getLegend ms',Math.round(performance.now()-t));log('  classes',JSON.stringify(g.classes?.map(k=>k.libelle+':'+k.compte)).slice(0,200))}catch(e){log('4 getLegend ✘',e.message)}
window.__ready=true;
window.__c=c;window.__man=man;
</script></body></html>
