<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas — configuration déclarative</title>
<style>:root{--atlas-principal:#6a1b9a;--atlas-fond:#fff8e1;--atlas-encre:#3e2723;--atlas-police:Georgia,serif}
:root.sombre{--atlas-principal:#90caf9;--atlas-fond:#10161c;--atlas-encre:#e6edf3;--atlas-police:system-ui}
body{margin:0;font:13px system-ui,sans-serif;background:var(--atlas-fond);color:var(--atlas-encre)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}.c{border:1px solid #bbb}.c h3{margin:0;padding:3px 6px;font-size:12px;background:#0001}atlas-bi{display:block;height:300px}
#res{padding:6px;font:11px/1.35 monospace;white-space:pre-wrap}button{padding:3px 8px}</style></head><body>
<div class="g">
 <div class="c"><h3>1 · <code>donnees</code> seul (manifeste inféré)</h3><atlas-bi id="e1" src="https://nic01asfr.github.io/Widgets-Grist/atlas/index.html" donnees="/geo-test/pts.geojson" delai-connexion="60000"></atlas-bi></div>
 <div class="c"><h3>2 · <code>manifeste</code> + <code>donnees</code> + <code>charte</code> + <code>fond="plan"</code></h3><atlas-bi id="e2" src="https://nic01asfr.github.io/Widgets-Grist/atlas/index.html" manifeste="/geo-test/manifeste.json" donnees="/geo-test/pts.geojson" charte="/geo-test/charte.json" fond="plan" delai-connexion="60000"></atlas-bi></div>
 <div class="c"><h3>3 · blocs <code>&lt;script data-atlas&gt;</code></h3><atlas-bi id="e3" src="https://nic01asfr.github.io/Widgets-Grist/atlas/index.html" delai-connexion="60000">
  <script type="application/json" data-atlas="manifeste">{"layers":[{"id":"p","name":"Trois points","geometry_type":"point","cle":"ref","style":{"declarative":{"kind":"single","color":"#d55e00"}}}]}</script>
  <script type="application/json" data-atlas="donnees">{"p":[{"type":"Feature","id":1,"properties":{"ref":"A"},"geometry":{"type":"Point","coordinates":[5.37,43.296]}},{"type":"Feature","id":2,"properties":{"ref":"B"},"geometry":{"type":"Point","coordinates":[5.375,43.297]}},{"type":"Feature","id":3,"properties":{"ref":"C"},"geometry":{"type":"Point","coordinates":[5.372,43.2985]}}]}</script></atlas-bi></div>
 <div class="c"><h3>4 · <code>charte="herite"</code> (variables CSS de la page) <button id="mode">basculer sombre</button></h3><atlas-bi id="e4" src="https://nic01asfr.github.io/Widgets-Grist/atlas/index.html" manifeste="/geo-test/manifeste.json" donnees="/geo-test/pts.geojson" charte="herite" delai-connexion="60000"></atlas-bi></div>
 <div class="c"><h3>5 · <code>base="aucune"</code> + <code>ratio-max="1"</code> (aucun fond tiers)</h3><atlas-bi id="e5" src="https://nic01asfr.github.io/Widgets-Grist/atlas/index.html" base="aucune" ratio-max="1" manifeste="/geo-test/manifeste.json" donnees="/geo-test/pts.geojson" delai-connexion="60000"></atlas-bi></div>
 <div class="c"><h3>6 · <code>donnees</code> invalide (fichier absent) → erreur attendue</h3><atlas-bi id="e6" src="https://nic01asfr.github.io/Widgets-Grist/atlas/index.html" donnees="/geo-test/absent.geojson" delai-connexion="60000"></atlas-bi></div>
</div><div id="res">…</div>
<script type="module">
await import('https://nic01asfr.github.io/Widgets-Grist/atlas/lib/bi/atlas-bi-element.js');
const out={};const $=id=>document.getElementById(id),show=()=>{$('res').textContent=Object.entries(out).map(([k,v])=>k+' : '+v).join('\n')};window.__out=out;
for(const id of['e1','e2','e3','e4','e5','e6']){const el=$(id);
 el.addEventListener('atlas-bi-configure',e=>{out[id+' configure']=JSON.stringify(e.detail.charge).slice(0,200);show()});
 el.addEventListener('atlas-bi-erreur',e=>{out[id+' erreur']=JSON.stringify(e.detail.erreur).slice(0,200);show()});
 el.addEventListener('atlas-bi-herite',e=>{out[id+' herite']=JSON.stringify(e.detail.charge||e.detail).slice(0,160);show()});
 (async()=>{try{await el.pret;await (el.configure||Promise.resolve());await new Promise(r=>setTimeout(r,3500));const l=await el.getLegend(id==='e3'?'p':(id==='e1'?undefined:'pts')).catch(e=>'legend: '+e.message);out[id+' légende']=JSON.stringify(l).slice(0,170);const p=await el.ping();out[id+' ping']=JSON.stringify(p.couches);}catch(e){out[id+' ✘']=(e.code||'')+' '+e.message}show()})()}
$('mode').onclick=()=>{document.documentElement.classList.toggle('sombre');out['bascule']=document.documentElement.classList.contains('sombre')?'sombre':'clair';show()};
</script></body></html>
